# Segredos e credenciais vêm do arquivo .env.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: transaction
    # 5433 no host para não colidir com um Postgres da máquina (5432).
    ports:
      - "5433:5432"
    volumes:
      - fintech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d transaction" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Broker de um nó só em modo KRaft (sem Zookeeper). Dentro do compose a aplicação usa kafka:9092;
  # quem roda a aplicação fora do Docker (bootRun) usa localhost:29092.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    volumes:
      - fintech_kafkadata:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  # Voz local (Kokoro) com a mesma API da OpenAI: é a voz do Claudinho quando o provedor é a Groq, que não tem voz
  # em português. Com a OpenAI ele não é usado; para não gastar memória, `docker compose stop kokoro`.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - "8880:8880"
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/transaction
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Provedor de IA (OpenAI ou Groq): só URL e chave; os modelos são escolhidos pela URL.
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com}
      AI_API_KEY: ${AI_API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AI_SPEECH: ${AI_SPEECH:-true}
      # Endereço do Kokoro dentro do compose; só é usado quando o provedor é a Groq.
      KOKORO_URL: http://kokoro:8880
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  fintech_pgdata:
  fintech_kafkadata:
