spring.application.name=budgeting
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Provedor de IA compatível com a API da OpenAI (OpenAI ou Groq), só URL e chave vêm do ambiente.
# Os modelos de chat e de transcrição são escolhidos pela URL em AiProviderDefaults.
spring.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${AI_API_KEY:${OPENAI_API_KEY:}}
spring.ai.openai.chat.options.response-format.type=TEXT
# Retry nativo do Spring AI. Só o 429 (limite do provedor) é repetido: um 400, como arquivo de áudio inválido, não melhora ao tentar de novo.
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5s
spring.ai.retry.on-http-codes=429
spring.ai.model.audio.transcription=openai
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
# O prompt do Whisper  é um trecho de exemplo que o modelo imita (estilo, vocabulário, números em dígitos).
spring.ai.openai.audio.transcription.options.prompt=Gastei 45 reais na farmácia. Paguei 1.250 reais de aluguel. Coloquei 50 de combustível. Comprei a ração do cachorro por 199 reais e 90 centavos. Qual é o meu saldo? Transfere 50 reais para maria.silva@gmail.com. Envia 120 reais para a conta 1234-567890.
# o app lê as respostas com a voz do dispositivo (expo-speech). O TTS abaixo só serve ao teste.
spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=nova
spring.ai.openai.audio.speech.options.speed=1.2
spring.ai.openai.audio.speech.options.response-format=mp3
logging.level.org.springframework.ai=DEBUG

# Docker controlado manualmente
spring.docker.compose.enabled=false

# Config Postgre
spring.datasource.url=jdbc:postgresql://localhost:5432/transaction
# Credenciais vêm do ambiente (DATABASE_USER com padrão postgres; DATABASE_PASSWORD obrigatória, sem padrão).
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Kafka: dentro do compose é kafka:9092; rodando fora do Docker, o broker publicado é localhost:29092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=budgeting
spring.kafka.consumer.auto-offset-reset=earliest
# Intervalo do publicador do outbox (ms).
budgeting.outbox.poll-interval-ms=1000

# Autenticação (HS256 vem do ambiente)
budgeting.security.jwt-secret=${JWT_SECRET}
budgeting.security.jwt-ttl=PT15M
budgeting.security.refresh-ttl=P30D

server.address=0.0.0.0